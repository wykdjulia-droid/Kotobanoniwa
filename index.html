<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Kotoba Garden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&family=DotGothic16&display=swap">
<style>
/* Layout: one centered column — title, then the board framed like a table-top console; scenes swap inside the frame */
:root{
  --table:#263b1c; --panel:#39562b; --edge:#1b2a13; --btn-border:#5f7f4b; --press:#101a0b;
  --text:#eef4e4; --muted:#b5c9a2; --grass:#8fde5e; --outline:#13230c; --glow:#ffe08a;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-label:"Silkscreen","Courier New",monospace;
  --f-jp:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--table);color:var(--text)}
body{font-family:var(--f-display);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:14px}
header{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
h1.jph{font-family:var(--f-jp);font-weight:400;letter-spacing:4px}
h1{margin:0;font-weight:700;font-size:clamp(30px,6vw,44px);color:var(--grass);text-shadow:3px 3px 0 var(--outline);letter-spacing:1px;text-wrap:balance}
.sub{font-family:var(--f-jp);color:var(--muted);font-size:15px}
.board{width:100%;background:var(--panel);border:3px solid var(--edge);box-shadow:0 0 0 3px var(--btn-border),6px 6px 0 3px var(--edge);padding:10px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.place{display:flex;align-items:baseline;gap:10px}
.place b{font-weight:700;font-size:18px}
.place b.jpn{font-family:var(--f-jp);font-weight:400;font-size:22px;letter-spacing:2px}
.place .jp{font-family:var(--f-jp);color:var(--muted)}
.lbl{font-family:var(--f-label);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.mback{position:absolute;z-index:3;left:12px;top:12px;font-family:var(--f-jp);font-size:clamp(11px,1.7vw,16px);line-height:1.2;color:var(--text);background:var(--edge);
  border:2px solid var(--btn-border);box-shadow:3px 3px 0 var(--press);padding:6px 12px;cursor:pointer;border-radius:0}
.mback:hover,.mback:focus-visible{border-color:var(--glow);outline:none}
.mback:active{transform:translate(3px,3px);box-shadow:none}

.gask{margin:0;display:flex;flex-direction:column;gap:2px}
.gask span{font-family:var(--f-jp);font-size:13px;color:var(--muted)}
.gask b{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--text)}
.gbuild{min-height:56px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;background:#f6efdc;border:3px solid var(--edge);box-shadow:0 0 0 2px var(--btn-border)}
.gbuild:empty::before{content:"したの ことばを じゅんばんに タップしてね";font-family:var(--f-jp);font-size:14px;color:#8a7a5a}
.gbuild.locked{opacity:.85}
.gbank{display:flex;flex-wrap:wrap;gap:6px;min-height:44px}
.tile{font-family:var(--f-jp);font-size:19px;line-height:1.2;color:#1d2a30;background:#fff8e6;border:2px solid #7a4a22;box-shadow:2px 2px 0 #7a4a22;padding:6px 10px;cursor:pointer;border-radius:0}
.tile:hover,.tile:focus-visible{background:#ffe9b8;outline:none}
.tile:active{transform:translate(2px,2px);box-shadow:none}
.tile.used{visibility:hidden}
.gbuild .tile{background:#fff;border-color:#2f4351;box-shadow:2px 2px 0 #2f4351}
.gbuild .tile.ok{background:#d6f5b8;border-color:#3e7a2a;box-shadow:2px 2px 0 #3e7a2a}
.gbuild .tile.bad{background:#ffd2c6;border-color:#a63a22;box-shadow:2px 2px 0 #a63a22}
.gbuild .stop{font-family:var(--f-jp);font-size:19px;color:#1d2a30}
.gcard{background:#f6efdc;color:#1d2a30;border:3px solid var(--edge);box-shadow:0 0 0 2px var(--btn-border);padding:12px 16px;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.gcard .gp{font-family:var(--f-jp);font-size:clamp(26px,7vw,38px);line-height:1.2}
.gcard .gr{font-family:var(--f-display);font-size:14px;color:#7a4a22}
.gcard .gm{font-family:var(--f-display);font-size:16px;color:#2f4351}
.gres{display:flex;flex-direction:column;gap:8px}
.gscore{display:flex;align-items:center;gap:10px}
.gscore b{font-family:var(--f-display);font-weight:700;font-size:28px;min-width:3.2em;font-variant-numeric:tabular-nums}
.gscore .meter{flex:1;height:14px}
.gscore .meter i{transition:width .6s steps(10)}
.gscore.pass b{color:var(--grass)}.gscore.fail b{color:#f08a6a}.gscore.fail .meter i{background:#d14b32}
.gline{display:grid;grid-template-columns:5.5em 1fr;gap:8px;align-items:baseline;background:var(--edge);border:2px solid var(--btn-border);padding:6px 10px}
.gline dt{font-family:var(--f-jp);font-size:13px;color:var(--muted)}
.gline dd{margin:0;font-family:var(--f-jp);font-size:18px;min-width:0;overflow-wrap:anywhere}
.gline dd.en{font-family:var(--f-display);font-size:15px;line-height:1.45}
.gverdict{font-family:var(--f-jp);font-size:18px;margin:0}
.gverdict.pass{color:var(--grass)}.gverdict.fail{color:#f08a6a}
.mback.mprac{left:auto;right:12px}
.mgrid{position:absolute;z-index:2;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(6,1fr);touch-action:none;line-height:0}
.mcell{position:relative;padding:0;margin:0;border:0;background:transparent;cursor:pointer;border-radius:0;min-width:0;min-height:0}
.mcell:focus-visible{outline:3px solid var(--glow);outline-offset:-3px}
.mcell.sel{box-shadow:inset 0 0 0 4px var(--glow)}
.mcell.hint{box-shadow:inset 0 0 0 3px rgba(255,224,138,.8)}
.mitem{position:absolute;inset:6%;background-image:url(merge_atlas.png);background-size:500% 900%;background-repeat:no-repeat;pointer-events:none;filter:drop-shadow(0 3px 0 rgba(29,58,34,.35))}
.mitem.crop{background-image:url(crops_atlas.png);background-size:700% 900%;inset:2% 10% 8%}
.mitem.lifting{opacity:.3}
.mitem.pop{animation:mpop .35s steps(4)}
@keyframes mpop{0%{transform:scale(.5)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.mlv{position:absolute;right:3%;bottom:3%;font-family:var(--f-display);font-weight:700;font-size:clamp(7px,1.2vw,12px);line-height:1;color:#fff8e6;background:#3e7a2a;border:2px solid var(--outline);padding:1px 4px;pointer-events:none}
.mlv.max{background:#d6703a}
.mghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-55%) scale(1.15);background-image:url(merge_atlas.png);background-size:500% 900%;filter:drop-shadow(0 6px 0 rgba(0,0,0,.3))}
.mghost.crop{background-image:url(crops_atlas.png);background-size:700% 900%}
.stage .mback{padding:clamp(3px,.8vw,6px) clamp(6px,1.4vw,12px)}
.mstore{position:absolute;z-index:3;left:50%;top:12px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font-family:var(--f-jp);font-size:15px;line-height:1.2;color:var(--text);background:var(--edge);border:2px solid var(--btn-border);padding:5px 12px}
.mstore b{font-family:var(--f-display);color:var(--glow)}
.custs{position:absolute;z-index:3;left:4%;right:4%;top:8.5%;height:31%;display:flex;justify-content:space-around;gap:2%;pointer-events:none}
.cust{pointer-events:auto;position:relative;display:flex;flex-direction:column;align-items:center;gap:0;width:30%;height:100%;padding:0;margin:0;border:0;background:transparent;cursor:default;border-radius:0}
.cust .face{flex:0 0 auto;height:56%;aspect-ratio:1;background-image:url(customers.png);background-size:700% 100%;background-repeat:no-repeat;filter:drop-shadow(0 4px 0 rgba(29,58,34,.4))}
.cust .bubble{display:flex;flex-wrap:nowrap;gap:6%;justify-content:center;background:rgba(255,248,230,.95);border:3px solid #7a4a22;box-shadow:3px 3px 0 rgba(74,51,34,.6);padding:5% 6% 4%;position:relative;margin-top:4%;max-width:100%}
.cust .bubble::before{content:"";position:absolute;left:50%;top:-11px;margin-left:-7px;border:7px solid transparent;border-bottom-color:#7a4a22;border-top:0}
.cust .want{display:flex;flex-direction:column;align-items:center;gap:2px;width:clamp(20px,4.4vw,52px);min-width:0;flex:0 1 auto}
.cust .want .ic{width:100%;aspect-ratio:1;background-image:url(merge_atlas.png);background-size:500% 900%;background-repeat:no-repeat}
.cust .want .n{font-family:var(--f-display);font-weight:700;font-size:clamp(8px,1.4vw,14px);line-height:1;color:#1d2a30;background:#fff;border:2px solid #7a4a22;padding:1px 3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cust .want.done .n{background:#9be37a;border-color:#3e7a2a}
.cust .pay{position:absolute;right:-8px;top:-12px;display:flex;align-items:center;gap:3px;font-family:var(--f-display);font-weight:700;font-size:clamp(8px,1.3vw,13px);line-height:1;color:var(--outline);background:#f6d256;border:2px solid #8a5a12;padding:2px 4px}
.cust .pay .coin{width:9px;height:9px}
.cust.ready{cursor:pointer}
.cust.ready .bubble{border-color:#3e7a2a;animation:readyGlow 1.2s steps(3) infinite}
@keyframes readyGlow{50%{box-shadow:0 0 0 4px var(--glow),3px 3px 0 rgba(74,51,34,.6)}}
.cust .go{position:absolute;left:50%;bottom:-4px;transform:translate(-50%,100%);font-family:var(--f-jp);font-size:clamp(8px,1.3vw,13px);line-height:1;color:var(--outline);background:var(--grass);border:2px solid var(--outline);padding:3px 5px;white-space:nowrap}
.cust.leave{animation:custLeave .7s steps(6) forwards}
.cust.arrive{animation:custArrive .5s steps(5) both}
@keyframes custLeave{to{transform:translateY(-20%);opacity:0}}
@keyframes custArrive{from{transform:translateY(20%);opacity:0}}
.cust.empty{visibility:hidden}
.stage.square{aspect-ratio:1/1;width:min(100%,82vh);align-self:center}
.stage{position:relative;border:3px solid var(--edge);line-height:0;aspect-ratio:3/2;max-width:100%;overflow:hidden;background:var(--edge)}
.scene{position:absolute;inset:0}
.scene img{display:block;width:100%;height:100%;max-width:100%}
.plot{position:absolute;padding:0;margin:0;background:transparent;border:2px solid transparent;cursor:pointer;border-radius:0;z-index:1}
.plot:hover,.plot:focus-visible{border-color:var(--glow);box-shadow:0 0 0 2px var(--outline);outline:none}
.plot.sel{border-color:var(--glow);box-shadow:0 0 0 2px var(--outline),0 0 12px 3px rgba(255,224,138,.6)}
.plot .plant{position:absolute;left:50%;bottom:4%;width:118%;aspect-ratio:144/152;transform:translateX(-50%);
  background-image:url(crops_atlas.png);background-size:700% 900%;background-repeat:no-repeat;image-rendering:auto;pointer-events:none}
.plot .plant.pop{animation:sprout .45s steps(5) both}
@keyframes sprout{0%{transform:translateX(-50%) scale(.2)}70%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(1)}}
.plot .plant.ready{animation:ready 1.4s steps(4) infinite}
@keyframes ready{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-50%) translateY(-4%)}}
.plot.ripe::after{content:"";position:absolute;right:-6%;top:-14%;width:22%;aspect-ratio:1;background:var(--glow);border:2px solid var(--outline);
  clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 1s steps(2) infinite}
@keyframes twinkle{50%{opacity:.35}}
.harvest{position:absolute;z-index:4;aspect-ratio:144/152;background-image:url(crops_atlas.png);background-size:700% 900%;pointer-events:none;
  animation:pick 1s steps(10) forwards}
@keyframes pick{0%{transform:translateY(0) scale(1);opacity:1}40%{transform:translateY(-55%) scale(1.25);opacity:1}100%{transform:translateY(-120%) scale(.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.plot .plant.ready,.plot.ripe::after{animation:none}}
.deco{position:absolute;pointer-events:none;z-index:1}
.tool,.bowl{position:absolute;padding:0;margin:0;background:transparent;border:2px solid transparent;cursor:pointer;border-radius:0;z-index:2}
.tool img,.bowl img{display:block;width:100%;height:100%;max-width:100%;pointer-events:none}
.litterbtn{cursor:default}.litterbtn.full{cursor:pointer}
.litterbtn:not(.full):hover{border-color:transparent!important;box-shadow:none!important}
.tool:hover,.tool:focus-visible,.bowl:hover,.bowl:focus-visible{border-color:var(--glow);box-shadow:0 0 0 2px var(--outline);outline:none}
.tool.out img{opacity:.28;filter:grayscale(1)}
.scene img.held{height:auto}
.held{position:absolute;z-index:6;pointer-events:none;transform:translate(-30%,-75%) rotate(-8deg);filter:drop-shadow(3px 4px 0 rgba(19,35,12,.45))}
.stage.carrying,.stage.carrying *{cursor:grabbing}
.shake{animation:shake .35s steps(6)}
@keyframes shake{0%,100%{translate:0}25%{translate:-3px}50%{translate:3px}75%{translate:-2px}}
.fx{position:absolute;z-index:5;pointer-events:none}
.fx i{position:absolute;display:block}
.fx.water i{width:5px;height:8px;background:#7cc8ff;box-shadow:0 0 0 2px #1d4c74;animation:drop .7s steps(6) forwards}
@keyframes drop{0%{transform:translateY(-30px);opacity:1}100%{transform:translateY(14px);opacity:0}}
.fx.soil i{width:8px;height:8px;background:#7a4a22;box-shadow:0 0 0 2px #3b2210;animation:puff .6s steps(5) forwards}
@keyframes puff{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),-22px);opacity:0}}
.seedmenu .need{display:flex;align-items:center;gap:8px;font-family:var(--f-jp);font-size:15px;color:var(--muted)}
.seedmenu .need img{width:38px;height:auto}
.seedmenu{position:fixed;z-index:40;width:250px;max-width:calc(100% - 12px);line-height:1.3;background:var(--panel);border:3px solid var(--edge);
  box-shadow:0 0 0 2px var(--btn-border),4px 4px 0 2px var(--edge);padding:8px;display:flex;flex-direction:column;gap:6px;animation:menuIn .18s steps(3) both}
@keyframes menuIn{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
.seedmenu .mt{font-family:var(--f-jp);font-size:15px;color:var(--muted)}
.seedmenu .act{font-family:var(--f-jp)!important;font-weight:400!important;font-size:16px!important}
.seedmenu .mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seedmenu .x{font-family:var(--f-display);font-size:14px;color:var(--text);background:var(--edge);border:2px solid var(--btn-border);padding:0 7px;cursor:pointer;border-radius:0;line-height:1.4}
.seedlist{display:flex;flex-direction:column;gap:3px;max-height:min(300px,52vh);overflow-y:auto}
.seedopt{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:8px;text-align:left;padding:3px 8px 3px 4px;
  font-family:var(--f-display);color:var(--text);background:var(--edge);border:2px solid transparent;cursor:pointer;border-radius:0}
.seedopt:hover,.seedopt:focus-visible{border-color:var(--grass);outline:none;background:#22351a}
.seedopt .ic{width:34px;aspect-ratio:144/152;background-image:url(crops_atlas.png);background-size:700% 900%}
.seedopt .jp{font-family:var(--f-jp);font-size:17px}
.seedopt .en{font-size:12px;color:var(--muted)}
.seedmenu .act{font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--text);background:var(--edge);border:2px solid var(--btn-border);
  box-shadow:3px 3px 0 var(--press);padding:6px 10px;cursor:pointer;border-radius:0}
.seedmenu .act:active{transform:translate(3px,3px);box-shadow:none}
.seedmenu .growing{display:flex;align-items:center;gap:10px}
.seedmenu .growing .ic{width:48px;aspect-ratio:144/152;background-image:url(crops_atlas.png);background-size:700% 900%}
.door{position:absolute;padding:0;margin:0;background:transparent;border:3px solid transparent;cursor:pointer;border-radius:0}
.door::after{content:attr(data-label);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;
  font-family:var(--f-display);font-weight:600;font-size:13px;line-height:1;color:var(--outline);background:var(--glow);border:2px solid var(--outline);
  padding:4px 7px;box-shadow:2px 2px 0 var(--outline);opacity:0;pointer-events:none}
.door.below::after{bottom:auto;top:calc(100% + 6px)}
.door:hover,.door:focus-visible{border-color:var(--glow);box-shadow:0 0 0 2px var(--outline),0 0 14px 4px rgba(255,224,138,.55);outline:none}
.door:hover::after,.door:focus-visible::after{opacity:1}
.door.hintpulse{animation:pulse 1.6s steps(4) infinite}
@keyframes pulse{0%,100%{border-color:transparent;box-shadow:none}50%{border-color:var(--glow);box-shadow:0 0 0 2px var(--outline)}}
  .stage.overcat{cursor:grab}.stage.holding,.stage.holding *{cursor:grabbing}
#dustLayer{z-index:4;position:absolute;inset:0;width:100%;height:100%;max-width:100%;pointer-events:none}
#catLayer{z-index:3;position:absolute;inset:0;width:100%;height:100%;max-width:100%;pointer-events:none}
.fade{position:absolute;inset:0;background:var(--edge);opacity:0;pointer-events:none}
.fade.on{animation:fade .5s steps(6) both}
@keyframes fade{0%,100%{opacity:0}50%{opacity:1}}
button.back{font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--text);background:var(--edge);border:2px solid var(--btn-border);
  box-shadow:3px 3px 0 var(--press);padding:6px 12px;cursor:pointer;border-radius:0}
button.back:active{transform:translate(3px,3px);box-shadow:none}
button.back:focus-visible{outline:2px solid var(--grass);outline-offset:2px}
.scene img.mess{position:absolute;inset:0;opacity:0;transition:opacity .8s steps(5);pointer-events:none}
.scene img.mess.on{opacity:1}
.rooms{display:flex;justify-content:space-between;gap:10px}
.rooms .chip{flex:0 1 240px;min-width:0}
.chip{font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--text);background:var(--edge);border:2px solid var(--btn-border);
  box-shadow:3px 3px 0 var(--press);padding:4px 10px;cursor:pointer;border-radius:0;display:flex;gap:6px;align-items:baseline}
.chip{flex-direction:column;align-items:stretch;gap:4px;padding:6px 10px 8px;text-align:left}
.chip .row1{font-family:var(--f-jp);font-weight:400;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter{height:8px;background:#0f180a;border:2px solid var(--outline);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--grass);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.meter i.low{background:#f0b070}
.chip.dirty .meter i{background:#c98a4a;width:0!important}
.chip .st{font-family:var(--f-jp);font-size:12px;color:var(--grass)}
.chip.dirty{border-color:#c98a4a}.chip.dirty .st{color:#f0b070}
.chip.busy{opacity:.6;cursor:wait}.chip.busy .st{color:var(--muted)}
.chip:not(.dirty){cursor:default}.chip:not(.dirty):active{transform:none;box-shadow:3px 3px 0 var(--press)}
.chip:active{transform:translate(3px,3px);box-shadow:none}
.chip:focus-visible{outline:2px solid var(--grass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.door.hintpulse,.fade.on{animation:none}.scene img.mess{transition:none}}
[hidden]{display:none!important}
.hud{display:flex;gap:8px;margin-left:auto}
.hud .hi{display:flex;align-items:center;gap:6px;background:var(--edge);border:2px solid var(--btn-border);padding:3px 10px 3px 6px;font-family:var(--f-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.coin{width:16px;height:16px;display:inline-block;background:#f6d256;border:2px solid #8a5a12;box-shadow:inset -3px -3px 0 #d9a52c,inset 2px 2px 0 #fff3b0;clip-path:polygon(25% 0,75% 0,100% 25%,100% 75%,75% 100%,25% 100%,0 75%,0 25%)}
.seedic{width:14px;height:16px;display:inline-block;background:#c98a4a;border:2px solid #4a2d14;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;box-shadow:inset -3px -2px 0 #8a5a2a}
.bulb{width:14px;height:16px;display:inline-block;background:#ffe08a;border:2px solid #6b5420;clip-path:polygon(20% 0,80% 0,100% 30%,80% 70%,70% 100%,30% 100%,20% 70%,0 30%)}
.bar{flex-wrap:wrap}

<script type="application/json" id="grammarData">[{"g":"間（あいだ）","r":"aida","m":"while; during; between","e":"While I was sleeping, my mother was cooking.","a":["私が","寝ている","間","母は","料理を","していました"],"n":"間 follows the ている form of a verb (or noun + の) and means the whole time that something is going on.","x":["寝た","寝ている"]},{"g":"間に（あいだに）","r":"aida ni","m":"while; during (something happened)","e":"While I was out, a friend came over.","a":["私が","出かけている","間に","友だちが","来ました"],"n":"間に marks one moment inside a period of time when something happened. Use the ている form before it.","x":["出かけた","出かけている"]},{"g":"あまり～ない","r":"amari ~ nai","m":"not very; not much","e":"This movie is not very interesting.","a":["この","映画は","あまり","おもしろく","ないです"],"n":"あまり must be followed by a negative. An い-adjective becomes 〜くない.","x":["おもしろい","おもしろく"]},{"g":"後で（あとで）","r":"ato de","m":"after; later","e":"After eating dinner, I take a bath.","a":["晩ごはんを","食べた","後で","おふろに","入ります"],"n":"後で follows the past (た) form of a verb, or a noun + の, even when talking about the future.","x":["食べる","食べた"]},{"g":"ば","r":"ba","m":"conditional: if A, then B","e":"If you read this book, you will understand.","a":["この","本を","読めば","わかります"],"n":"For the ば form, change the last u-sound of the verb to an e-sound and add ば: 読む → 読めば.","x":["読むば","読めば"]},{"g":"場合は（ばあいは）","r":"baai wa","m":"in the event of; in the case that","e":"In case of rain, the match is cancelled.","a":["雨の","場合は","試合は","中止です"],"n":"After a noun, 場合は needs の: 雨の場合は.","x":["雨な","雨の"]},{"g":"ばかり","r":"bakari","m":"only; nothing but","e":"My younger brother does nothing but play games.","a":["弟は","ゲーム","ばかり","しています"],"n":"Noun + ばかり means \"nothing but\" that thing, and is often used with している.","x":["しか","ばかり"]},{"g":"だけで","r":"dake de","m":"just by; just by doing","e":"Just by looking at it, I got hungry.","a":["見る","だけで","おなかが","すきました"],"n":"だけで follows the plain dictionary form: 見るだけで = just by looking.","x":["見て","見る"]},{"g":"出す（だす）","r":"dasu","m":"to begin to; to burst into","e":"The baby suddenly started crying.","a":["赤ちゃんが","急に","泣き","出しました"],"n":"出す attaches to the masu-stem (泣き) and means something suddenly starts or bursts out.","x":["泣いて","泣き"]},{"g":"でございます","r":"de gozaimasu","m":"to be (honorific)","e":"This is the reception desk.","a":["こちらが","受付","でございます"],"n":"でございます is the very polite form of です, used by shop and hotel staff."},{"g":"でも","r":"demo","m":"… or something; how about","e":"Shall we have some tea or something?","a":["お茶","でも","飲みましょう","か"],"n":"Noun + でも makes a soft suggestion: \"tea or something\".","x":["には","でも"]},{"g":"ではないか","r":"dewa nai ka","m":"right?; isn't it?","e":"Isn't that Tanaka over there?","a":["あそこに","いるのは","田中さん","ではないか"],"n":"ではないか at the end asks for agreement: \"isn't it?\""},{"g":"が必要（がひつよう）","r":"ga hitsuyou","m":"need; necessary","e":"A passport is necessary for travel.","a":["旅行には","パスポート","が","必要です"],"n":"The thing that is needed takes が, not を: パスポートが必要です.","x":["を","が"]},{"g":"がする","r":"ga suru","m":"to smell; to hear; to taste (a sense of)","e":"I hear a strange sound.","a":["変な","音","が","します"],"n":"Sounds, smells and tastes take が with する: 音がする = a sound can be heard.","x":["を","が"]},{"g":"がる / がっている","r":"garu / gatte iru","m":"to show signs of; to appear to feel","e":"My little sister wants a cat.","a":["妹は","ねこを","ほしがって","います"],"n":"For other people's feelings, change い-adjectives with がる: ほしい → ほしがっている.","x":["ほしくて","ほしがって"]},{"g":"ございます","r":"gozaimasu","m":"to be; to exist (polite)","e":"The restroom is on the second floor.","a":["トイレは","二階に","ございます"],"n":"ございます is the polite form of ある/いる. Note the spelling: ございます.","x":["ござります","ございます"]},{"g":"始める（はじめる）","r":"hajimeru","m":"to start to; to begin to","e":"It started to rain.","a":["雨が","降り","始めました"],"n":"始める attaches to the masu-stem: 降り始める = start to fall.","x":["降って","降り"]},{"g":"はずだ","r":"hazu da","m":"it must be; it should be (expectation)","e":"He should come by three o'clock.","a":["彼は","三時までに","来る","はずです"],"n":"はず follows the plain form of a verb and shows a strong expectation.","x":["来て","来る"]},{"g":"はずがない","r":"hazu ga nai","m":"cannot be; impossible","e":"There's no way she would forget.","a":["彼女が","忘れる","はずが","ありません"],"n":"Plain form + はずがない means it's impossible that this happens.","x":["忘れて","忘れる"]},{"g":"必要がある（ひつようがある）","r":"hitsuyou ga aru","m":"need to; it is necessary to","e":"You need to hand in the report by tomorrow.","a":["明日までに","レポートを","出す","必要が","あります"],"n":"Dictionary form + 必要がある = it is necessary to do it.","x":["出して","出す"]},{"g":"意向形（いこうけい）","r":"ikou kei","m":"volitional form; let's do","e":"Let's go to the sea together.","a":["いっしょに","海へ","行こう"],"n":"The volitional form (行く → 行こう) means \"let's do\" or \"I'll do\".","x":["行く","行こう"],"alt":[["海へ","いっしょに","行こう"]]},{"g":"いらっしゃる","r":"irassharu","m":"to be; to come; to go (honorific)","e":"The teacher is in the classroom.","a":["先生は","教室に","いらっしゃいます"],"n":"いらっしゃる is the honorific \"to be / come / go\" for people you respect. まいる is humble, for yourself.","x":["まいります","いらっしゃいます"]},{"g":"いたします","r":"itashimasu","m":"to do (humble)","e":"I will show you the way.","a":["私が","ご案内","いたします"],"n":"いたします is the humble form of します, used about your own actions.","x":["なさいます","いたします"]},{"g":"じゃないか","r":"ja nai ka","m":"right?; isn't it?; let's","e":"Let's do our best together!","a":["いっしょに","がんばろう","じゃないか"],"n":"Volitional form + じゃないか is a strong, friendly \"let's\".","x":["がんばる","がんばろう"]},{"g":"かどうか","r":"ka dou ka","m":"whether or not","e":"I don't know whether he will come.","a":["彼が","来る","かどうか","わかりません"],"n":"Plain form + かどうか = whether or not.","x":["来て","来る"]},{"g":"かしら","r":"kashira","m":"I wonder (feminine)","e":"I wonder if it will rain tomorrow.","a":["明日は","雨が","降る","かしら"],"n":"かしら (I wonder) follows the plain form. It sounds soft and feminine.","x":["降って","降る"]},{"g":"かい","r":"kai","m":"yes/no question (casual)","e":"Are you coming too?","a":["君も","行く","かい"],"n":"Casual yes/no question: plain form + かい.","x":["行って","行く"]},{"g":"かもしれない","r":"kamo shirenai","m":"might; perhaps","e":"It might snow tonight.","a":["今夜は","雪が","降る","かもしれません"],"n":"Plain form + かもしれない = might, maybe.","x":["降って","降る"]},{"g":"かな","r":"kana","m":"I wonder; should I?","e":"I wonder if he is at home.","a":["彼は","家に","いる","かな"],"n":"Plain form + かな = I wonder.","x":["いて","いる"]},{"g":"から作る（からつくる）","r":"kara tsukuru","m":"made from","e":"Wine is made from grapes.","a":["ワインは","ぶどう","から","作ります"],"n":"Use から when the material changes completely (grapes → wine). で is for materials you can still see.","x":["で","から"]},{"g":"きっと","r":"kitto","m":"surely; most likely","e":"She will surely pass the exam.","a":["彼女は","きっと","試験に","合格するでしょう"],"n":"きっと = surely. Note: you pass an exam with に: 試験に合格する.","x":["試験を","試験に"],"alt":[["きっと","彼女は","試験に","合格するでしょう"]]},{"g":"頃（ころ／ごろ）","r":"koro / goro","m":"around; about; when","e":"I get up at around seven every morning.","a":["毎朝","七時","ごろ","起きます"],"n":"ごろ after a time means \"around\": 七時ごろ.","x":["ごろの","ごろ"]},{"g":"こと","r":"koto","m":"verb nominalizer","e":"My hobby is reading books.","a":["私の","しゅみは","本を","読む","ことです"],"n":"Dictionary form + こと turns a verb into a noun: 読むこと = reading.","x":["読んで","読む"]},{"g":"ことがある","r":"koto ga aru","m":"there are times when","e":"I have been to Kyoto.","a":["京都に","行った","ことが","あります"],"n":"Past (た) form + ことがある = have done it before. (Dictionary form + ことがある means \"sometimes\".)","x":["行く","行った"]},{"g":"ことができる","r":"koto ga dekiru","m":"can; be able to","e":"I can swim.","a":["私は","泳ぐ","ことが","できます"],"n":"Dictionary form + ことができる = can, be able to.","x":["泳いで","泳ぐ"]},{"g":"ことになる","r":"koto ni naru","m":"it has been decided that; it turns out that","e":"It has been decided that I will move to Osaka.","a":["大阪に","引っ越す","ことに","なりました"],"n":"ことになる means it was decided (by others or by circumstances).","x":["引っ越して","引っ越す"]},{"g":"ことにする","r":"koto ni suru","m":"to decide to","e":"I decided to quit smoking.","a":["たばこを","やめる","ことに","しました"],"n":"ことにする means you made the decision yourself.","x":["やめて","やめる"]},{"g":"くする","r":"ku suru","m":"to make something (adjective)","e":"Please make the room brighter.","a":["部屋を","明るく","してください"],"n":"To \"make something (adjective)\", change い to く and add する: 明るくする.","x":["明るい","明るく"]},{"g":"急に（きゅうに）","r":"kyuu ni","m":"suddenly; unexpectedly","e":"It suddenly got cold.","a":["急に","寒く","なりました"],"n":"急に = suddenly. \"Became cold\" is 寒くなる, with い → く.","x":["寒い","寒く"]},{"g":"まだ～ていない","r":"mada ~te inai","m":"have not … yet","e":"I haven't eaten lunch yet.","a":["まだ","昼ごはんを","食べて","いません"],"n":"\"Not yet\" is まだ + ていない, not the past tense.","x":["食べた","食べて"],"alt":[["昼ごはんを","まだ","食べて","いません"]]},{"g":"までに","r":"made ni","m":"by (a time); before","e":"Please come by five o'clock.","a":["五時","までに","来てください"],"n":"までに = by (a deadline). まで = until (the whole time).","x":["まで","までに"]},{"g":"まま","r":"mama","m":"as it is; leaving unchanged","e":"I fell asleep with the TV on.","a":["テレビを","つけた","まま","寝ました"],"n":"た form + まま = leaving it in that state.","x":["つける","つけた"]},{"g":"みたいだ","r":"mitai da","m":"looks like; seems like","e":"It looks like it will rain.","a":["雨が","降る","みたいです"],"n":"Plain form + みたい = it looks like, it seems.","x":["降って","降る"]},{"g":"な（禁止）","r":"na (kinshi)","m":"don't (prohibition)","e":"Don't enter this room.","a":["この","部屋に","入る","な"],"n":"Dictionary form + な is a strong \"don't\". 入れ is the command \"enter!\".","x":["入れ","入る"]},{"g":"など","r":"nado","m":"such as; et cetera","e":"I bought things like apples and mandarins.","a":["りんごや","みかん","などを","買いました"],"n":"や…など lists examples. The object particle を comes after など.","x":["などに","などを"]},{"g":"ながら","r":"nagara","m":"while doing","e":"I study while listening to music.","a":["音楽を","聞き","ながら","勉強します"],"n":"ながら attaches to the masu-stem: 聞きながら = while listening.","x":["聞いて","聞き"]},{"g":"ないで","r":"naide","m":"without doing","e":"I went to school without eating breakfast.","a":["朝ごはんを","食べないで","学校へ","行きました"],"n":"ないで = without doing. なくて is used for reasons, not for \"without\".","x":["食べなくて","食べないで"]},{"g":"なければならない","r":"nakereba naranai","m":"must; have to","e":"I have to go to the hospital tomorrow.","a":["明日","病院へ","行かなければ","なりません"],"n":"ない form → なければならない = must.","x":["行かなくて","行かなければ"]},{"g":"なくてもいい","r":"nakute mo ii","m":"don't have to","e":"You don't have to come tomorrow.","a":["明日は","来なくても","いいです"],"n":"ない form → なくてもいい = you don't have to.","x":["来なければ","来なくても"]},{"g":"なら","r":"nara","m":"if; in the case of","e":"If it's sushi, that shop is good.","a":["すしなら","あの店が","おいしいです"],"n":"Topic + なら = \"if it's about…\", used for advice.","x":["すしだら","すしなら"]},{"g":"なさい","r":"nasai","m":"do … (command)","e":"Clean your room right now.","a":["今すぐ","部屋を","そうじ","しなさい"],"n":"masu-stem + なさい is a firm command, like a parent to a child.","x":["して","しなさい"]},{"g":"にくい","r":"nikui","m":"hard to do","e":"This pen is hard to write with.","a":["この","ペンは","書き","にくいです"],"n":"masu-stem + にくい = hard to do.","x":["書いて","書き"]},{"g":"にする","r":"ni suru","m":"to decide on; to choose","e":"I'll have coffee.","a":["私は","コーヒー","に","します"],"n":"Noun + にする = to choose or decide on it.","x":["を","に"]},{"g":"になる","r":"ni naru","m":"to become","e":"I want to become a doctor in the future.","a":["将来は","医者に","なりたいです"],"n":"Noun + になる = to become.","x":["医者を","医者に"]},{"g":"によると","r":"ni yoru to","m":"according to","e":"According to the forecast, it will be sunny tomorrow.","a":["天気予報に","よると","明日は","晴れる","そうです"],"n":"によると gives a source, and usually ends with そうだ (I heard).","x":["よって","よると"]},{"g":"の中で（のなかで）","r":"no naka de","m":"among; of all","e":"Of all the seasons, I like spring the best.","a":["季節の","中で","春が","一番","好きです"],"n":"AのなかでBが一番 = among A, B is the most.","x":["から","中で"]},{"g":"のに","r":"noni","m":"even though; despite","e":"Even though I studied, I failed the exam.","a":["勉強した","のに","試験に","落ちました"],"n":"のに = even though (with surprise or disappointment). ので = because.","x":["ので","のに"]},{"g":"ので","r":"node","m":"because; since","e":"Because I have a fever, I'll rest today.","a":["熱が","ある","ので","今日は","休みます"],"n":"ので = because, so. のに means \"even though\".","x":["のに","ので"]},{"g":"のが上手（のがじょうず）","r":"no ga jouzu","m":"good at doing","e":"My father is good at cooking.","a":["父は","料理を","作る","のが","上手です"],"n":"Dictionary form + のが上手 = good at doing.","x":["ことを","のが"]},{"g":"のが好き（のがすき）","r":"no ga suki","m":"like doing","e":"I like walking in the park.","a":["公園を","散歩する","のが","好きです"],"n":"Dictionary form + のが好き = like doing. 好き takes が, not を.","x":["のを","のが"]},{"g":"んです","r":"n desu","m":"explanatory: it is that …","e":"(Why are you late?) Because the train was late.","a":["電車が","遅れた","んです"],"n":"んです explains a reason or situation. It follows the plain form.","x":["遅れたんだ","遅れた"]},{"g":"お～になる","r":"o ~ ni naru","m":"honorific verb form","e":"The teacher has already gone home.","a":["先生は","もう","お帰りに","なりました"],"n":"お + masu-stem + になる is honorific, for respected people.","x":["お帰りし","お帰りに"]},{"g":"お～する","r":"o ~ suru","m":"humble verb form","e":"I'll carry your bag for you.","a":["荷物を","お持ち","します"],"n":"お + masu-stem + する is humble, for your own actions.","x":["お持ちに","お持ち"]},{"g":"させる","r":"saseru","m":"causative: make / let someone do","e":"The mother made her child eat vegetables.","a":["母は","子どもに","野菜を","食べさせました"],"n":"させる is the causative: make or let someone do. られる is passive.","x":["食べられました","食べさせました"]},{"g":"させてください","r":"sasete kudasai","m":"please let me","e":"Please let me go home early today.","a":["今日は","早く","帰らせて","ください"],"n":"Causative て form + ください = please let me.","x":["帰って","帰らせて"]},{"g":"し","r":"shi","m":"and (listing reasons)","e":"This shop is cheap, and the food is tasty too.","a":["この店は","安いし","おいしいです"],"n":"し lists reasons: plain form + し. い-adjectives don't take だ.","x":["安いだし","安いし"]},{"g":"しか～ない","r":"shika ~ nai","m":"only; nothing but","e":"I only have 100 yen.","a":["百円","しか","ありません"],"n":"しか always needs a negative verb: しかありません.","x":["あります","ありません"]},{"g":"すぎる","r":"sugiru","m":"too much; overly","e":"I ate too much yesterday.","a":["昨日は","食べ","すぎました"],"n":"masu-stem + すぎる = too much.","x":["食べて","食べ"]},{"g":"らしい","r":"rashii","m":"it seems; I heard; typical of","e":"He seems to be sick.","a":["彼は","病気","らしいです"],"n":"Noun + らしい (no だ) = it seems, I heard.","x":["病気だ","病気"]},{"g":"られる（可能形）","r":"rareru (kanou kei)","m":"potential form: can do","e":"I can eat natto.","a":["私は","なっとうが","食べられます"],"n":"The potential form of ru-verbs is られる: 食べられる = can eat.","x":["食べさせます","食べられます"]},{"g":"命令形（めいれいけい）","r":"meirei kei","m":"imperative form","e":"Run faster!","a":["もっと","速く","走れ"],"n":"The imperative form changes the last u-sound to e: 走る → 走れ.","x":["走る","走れ"]},{"g":"もし～たら","r":"moshi ~ tara","m":"if (supposing)","e":"If I had money, I would buy a car.","a":["もし","お金が","あったら","車を","買います"],"n":"もし + た form + ら = if. Make the た form first: あった → あったら.","x":["あるたら","あったら"]},{"g":"そうだ（伝聞）","r":"sou da (denbun)","m":"I heard that; it is said that","e":"I heard it will snow tomorrow.","a":["明日は","雪が","降る","そうです"],"n":"Hearsay そうだ follows the plain form: 降るそうです = I heard it will fall.","x":["降り","降る"]},{"g":"そうだ（様態）","r":"sou da (youtai)","m":"looks like; appears to be","e":"This cake looks delicious.","a":["この","ケーキは","おいし","そうです"],"n":"\"Looks like\" そうだ drops the い of an adjective: おいしそう.","x":["おいしい","おいし"]},{"g":"そうに／そうな","r":"sou ni / sou na","m":"seems like; looks like","e":"The child is eating happily.","a":["子どもが","うれし","そうに","食べています"],"n":"Drop い and add そうに to describe how someone does something.","x":["うれしい","うれし"]},{"g":"たばかり","r":"ta bakari","m":"just finished; just happened","e":"I have just come to Japan.","a":["日本に","来た","ばかりです"],"n":"た form + ばかり = have just done.","x":["来る","来た"]},{"g":"たところ","r":"ta tokoro","m":"just finished doing","e":"I have just got home.","a":["今","家に","帰った","ところです"],"n":"た form + ところ = just finished. Dictionary form + ところ means \"about to\".","x":["帰る","帰った"]},{"g":"たがる","r":"tagaru","m":"wants to do (third person)","e":"My brother wants to go to Japan.","a":["弟は","日本へ","行き","たがっています"],"n":"For someone else's wish, use masu-stem + たがる.","x":["行って","行き"]},{"g":"たら","r":"tara","m":"if; after; when","e":"When I got home, a letter had arrived.","a":["家に","帰ったら","手紙が","来ていました"],"n":"たら is made from the た form: 帰った → 帰ったら.","x":["帰るたら","帰ったら"]},{"g":"たらどう","r":"tara dou","m":"why don't you; how about","e":"Why don't you go to the doctor?","a":["医者に","行ったら","どうですか"],"n":"た form + ら + どうですか gives advice: why don't you…?","x":["行くたら","行ったら"]},{"g":"たらいいですか","r":"tara ii desu ka","m":"what should I do?","e":"What should I do?","a":["何を","したら","いいですか"],"n":"た form + ら + いいですか asks for advice: what should I…?","x":["するたら","したら"]},{"g":"て／で（理由）","r":"te / de","m":"because of A, B","e":"I couldn't sleep because it was noisy.","a":["音が","うるさくて","寝られませんでした"],"n":"The て form can give a reason. い-adjectives become くて.","x":["うるさいて","うるさくて"]},{"g":"てあげる","r":"te ageru","m":"to do for someone","e":"I taught my friend English.","a":["友だちに","英語を","教えて","あげました"],"n":"てあげる = do something for someone else. てくれる is when someone does it for you.","x":["くれました","あげました"]},{"g":"てほしい","r":"te hoshii","m":"I want you to","e":"I want you to come to the party.","a":["あなたに","パーティーに","来て","ほしいです"],"n":"て form + ほしい = I want you to do it. たい is for your own wishes.","x":["来たい","来て"]},{"g":"ていく","r":"te iku","m":"to go on; to continue","e":"The number of people will keep increasing.","a":["人が","増えて","いくでしょう"],"n":"て form + いく = a change that continues into the future.","x":["増える","増えて"]},{"g":"ていた","r":"te ita","m":"was doing","e":"I was watching TV at that time.","a":["その時","テレビを","見て","いました"],"n":"ていた = was doing (past continuous).","x":["見た","見て"]},{"g":"ていただけませんか","r":"te itadakemasen ka","m":"could you please","e":"Could you please write your name?","a":["名前を","書いて","いただけませんか"],"n":"て form + いただけませんか is a very polite request.","x":["書く","書いて"]},{"g":"てくれる","r":"te kureru","m":"to do a favour for me","e":"My friend lent me an umbrella.","a":["友だちが","かさを","貸して","くれました"],"n":"てくれる = someone does something for me.","x":["あげました","くれました"]},{"g":"てくる","r":"te kuru","m":"to come to; to start; to go and come back","e":"I'll go and buy some juice (and come back).","a":["ジュースを","買って","きます"],"n":"て form + くる = go and do something, then come back.","x":["買い","買って"]},{"g":"てみる","r":"te miru","m":"to try doing","e":"I tried eating sushi.","a":["すしを","食べて","みました"],"n":"て form + みる = try doing.","x":["食べ","食べて"]},{"g":"てもらう","r":"te morau","m":"to get someone to do","e":"I had my friend fix my bike.","a":["友だちに","自転車を","直して","もらいました"],"n":"AにVてもらう = get A to do V for me. The helper takes に.","x":["くれました","もらいました"]},{"g":"ておく","r":"te oku","m":"to do in advance","e":"I'll buy the ticket in advance.","a":["切符を","買って","おきます"],"n":"て form + おく = do in advance, to be ready.","x":["買い","買って"]},{"g":"てしまう／ちゃう","r":"te shimau / chau","m":"to do by accident; to finish completely","e":"I lost my wallet.","a":["さいふを","なくして","しまいました"],"n":"て form + しまう = did by accident, or finished completely (often with regret).","x":["なくし","なくして"]},{"g":"てすみません","r":"te sumimasen","m":"I'm sorry for","e":"Sorry for being late.","a":["遅れて","すみません"],"n":"て form + すみません = sorry for doing.","x":["遅れる","遅れて"]},{"g":"てよかった","r":"te yokatta","m":"I'm glad that","e":"I'm glad I came to Japan.","a":["日本に","来て","よかったです"],"n":"て form + よかった = I'm glad that.","x":["来た","来て"]},{"g":"ているところ","r":"te iru tokoro","m":"in the process of doing","e":"I'm in the middle of eating dinner now.","a":["今","晩ごはんを","食べて","いるところです"],"n":"ているところ = right in the middle of doing.","x":["食べた","食べて"]},{"g":"ても","r":"temo","m":"even if; even though","e":"Even if it rains, I'll go.","a":["雨が","降っても","行きます"],"n":"ても is made from the て form: 降って → 降っても.","x":["降るても","降っても"]},{"g":"と","r":"to","m":"whenever A, B","e":"When you press this button, the door opens.","a":["このボタンを","押すと","ドアが","開きます"],"n":"Dictionary form + と = whenever A happens, B always follows.","x":["押したと","押すと"]},{"g":"という","r":"to iu","m":"called; named","e":"I read a book called \"Kokoro\".","a":["「こころ」と","いう","本を","読みました"],"n":"AというB = a B called A.","x":["言った","いう"]},{"g":"ということ","r":"to iu koto","m":"the fact that","e":"I didn't know that he got married.","a":["彼が","結婚した","ということを","知りませんでした"],"n":"ということ turns a whole sentence into a noun: \"the fact that\".","x":["というを","ということを"]},{"g":"と言われている（といわれている）","r":"to iwarete iru","m":"it is said that","e":"It is said that this temple was built 1000 years ago.","a":["この寺は","千年前に","建てられたと","言われています"],"n":"と言われている = it is said that (passive of 言う).","x":["言っています","言われています"]},{"g":"と聞いた（ときいた）","r":"to kiita","m":"I heard that","e":"I heard that Tanaka is moving.","a":["田中さんが","引っ越すと","聞きました"],"n":"Quote with と before 聞いた: …と聞きました = I heard that….","x":["引っ越すを","引っ越すと"]},{"g":"と思う（とおもう）","r":"to omou","m":"I think","e":"I think it will be sunny tomorrow.","a":["明日は","晴れると","思います"],"n":"Plain form + と思う = I think.","x":["晴れるを","晴れると"]},{"g":"とか～とか","r":"toka ~ toka","m":"such as; things like","e":"I like things like soccer and tennis.","a":["私は","サッカーとか","テニスとかが","好きです"],"n":"とか…とか lists examples, a bit casually.","x":["サッカーと","サッカーとか"]},{"g":"ところ","r":"tokoro","m":"about to; on the verge of","e":"I'm just about to go out.","a":["今から","出かける","ところです"],"n":"Dictionary form + ところ = just about to.","x":["出かけた","出かける"]},{"g":"続ける（つづける）","r":"tsuzukeru","m":"to continue to","e":"He kept running for two hours.","a":["彼は","二時間","走り","続けました"],"n":"masu-stem + 続ける = keep on doing.","x":["走って","走り"]},{"g":"って","r":"tte","m":"named; called; (quoting)","e":"What does this word mean?","a":["この","言葉って","どういう","意味ですか"],"n":"って is a casual topic marker or quote: \"this word, what does it mean?\"","x":["言葉を","言葉って"]},{"g":"受身形（うけみけい）","r":"ukemi kei","m":"passive form","e":"I was scolded by my teacher.","a":["私は","先生に","しかられました"],"n":"Passive: the doer takes に and the verb uses られる / れる.","x":["しかりました","しかられました"]},{"g":"は～が","r":"wa ~ ga","m":"A, but B (contrast)","e":"I like dogs, but I don't like cats.","a":["犬は","好きですが","ねこは","好きではありません"],"n":"Using は for both nouns contrasts them, and が joins: A は…が、B は….","x":["好きですので","好きですが"]},{"g":"やすい","r":"yasui","m":"easy to do","e":"This book is easy to read.","a":["この","本は","読み","やすいです"],"n":"masu-stem + やすい = easy to do.","x":["読んで","読み"]},{"g":"ようだ","r":"you da","m":"it seems; it appears","e":"There seems to be someone in the room.","a":["部屋に","だれか","いる","ようです"],"n":"Plain form + ようだ = it seems (from what I can see).","x":["いて","いる"]},{"g":"ように","r":"you ni","m":"so that; in order to","e":"I take notes so that I don't forget.","a":["忘れない","ように","メモを","します"],"n":"ように = so that. It often follows a negative or potential form.","x":["忘れて","忘れない"]},{"g":"ようにする","r":"you ni suru","m":"to try to; to make sure to","e":"I try to go to bed early every day.","a":["毎日","早く","寝る","ように","しています"],"n":"ようにする = try to, make an effort to.","x":["寝て","寝る"]},{"g":"ようになる","r":"you ni naru","m":"to reach the point that; to come to","e":"I have become able to read kanji.","a":["漢字が","読める","ように","なりました"],"n":"ようになる = reach the point where you can, or change to doing.","x":["しました","なりました"]},{"g":"ように言う（ようにいう）","r":"you ni iu","m":"to tell someone to","e":"The teacher told me to study more.","a":["先生は","私に","もっと","勉強する","ように","言いました"],"n":"Plain form + ように言う = tell someone to do.","x":["勉強して","勉強する"]},{"g":"ようと思う（ようとおもう）","r":"you to omou","m":"thinking of doing","e":"I'm thinking of going to Kyoto next year.","a":["来年","京都へ","行こうと","思っています"],"n":"Volitional form + と思う = thinking of doing.","x":["行くと","行こうと"]},{"g":"予定だ（よていだ）","r":"yotei da","m":"plan to; scheduled to","e":"I plan to go back to my country next week.","a":["来週","国へ","帰る","予定です"],"n":"Dictionary form + 予定だ = plan to, scheduled to.","x":["帰って","帰る"]},{"g":"ずに","r":"zu ni","m":"without doing","e":"I went <script>
(()=>{
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const scenes={
  garden:{el:document.getElementById('garden'),name:'にわ'},
  cottage:{el:document.getElementById('cottage'),name:'いえ'},
  market:{el:document.getElementById('market'),name:'いちば'},
};
const fade=document.getElementById('fade');
let current='garden';
function show(id){
  current=id;
  for(const k in scenes)scenes[k].el.hidden=k!==id;
  document.getElementById('placeName').textContent=scenes[id].name;
  document.querySelector('.stage').classList.toggle('square',id==='market');
  document.getElementById('roomsTop').hidden=id!=='cottage';document.getElementById('roomsBottom').hidden=id!=='cottage';
}

/* rooms get messy one at a time */
const ROOMS=[{id:'bedroom',name:'しんしつ'},{id:'bathroom',name:'おふろ'},{id:'kitchen',name:'だいどころ'},{id:'living',name:'いま'}];
const dirty=new Set();
ROOMS.forEach(r=>{
  const b=document.createElement('button');b.className='chip';b.id='chip-'+r.id;
  b.innerHTML=`<span class="row1">${r.name}<span class="st">clean</span></span><span class="meter" aria-hidden="true"><i style="width:100%"></i></span>`;
  b.onclick=()=>{if(!cleaning[r.id]&&dirty.has(r.id))requireKanji(()=>{if(!cleaning[r.id]&&dirty.has(r.id))cleanRoom(r.id);});};
  document.getElementById(r.id==='bedroom'||r.id==='bathroom'?'roomsTop':'roomsBottom').appendChild(b);
});
function setDirty(id,on){
  on?dirty.add(id):dirty.delete(id);
  document.querySelector(`.mess[data-room="${id}"]`).classList.toggle('on',on);
  const c=document.getElementById('chip-'+id);c.classList.toggle('dirty',on);c.querySelector('.st').textContent=on?'きたない':'きれい';
}

/* ---------- dust cloud while a room is cleaned ---------- */
const DUST=[[0, 0, 340, 161], [342, 0, 176, 152], [520, 0, 177, 137], [699, 0, 141, 110], [842, 0, 105, 82], [949, 0, 300, 172], [1251, 0, 214, 166], [1467, 0, 296, 161], [1765, 0, 254, 143], [0, 174, 388, 132], [390, 174, 779, 127], [1171, 174, 717, 107], [0, 308, 765, 226], [767, 308, 734, 227], [1503, 308, 251, 220], [1756, 308, 248, 234], [0, 544, 177, 219], [179, 544, 148, 220], [329, 544, 250, 214], [581, 544, 108, 210], [691, 544, 178, 204]];
const dustImg=new Image();dustImg.src='dust.png';
const dc=document.getElementById('dustLayer').getContext('2d');
const ROOM_BOX={bedroom:[100,45,850,372],bathroom:[870,95,1470,372],kitchen:[100,390,690,850],living:[700,390,1470,850]};
const WIDE=DUST.map((d,i)=>i).filter(i=>DUST[i][2]>560),ROUND=DUST.map((d,i)=>i).filter(i=>DUST[i][2]<=420&&DUST[i][3]<=185),TALL=DUST.map((d,i)=>i).filter(i=>DUST[i][3]>DUST[i][2]*1.05);
const cleaning={};             // room -> {t, clouds, specks, swapped}
const HOLD=3000,POP=450,FADE=900;
function rnd(a,b){return a+Math.random()*(b-a);}
function cleanRoom(id){
  if(cleaning[id]||!dirty.has(id))return;
  const [x0,y0,x1,y1]=ROOM_BOX[id],w=x1-x0,h=y1-y0,clouds=[];
  const add=(i,cx,cy,targetW,delay)=>{const d=DUST[i];targetW=Math.min(targetW,w*1.02);let sc=targetW/d[2];
    if(d[3]*sc>cy-y0+40)sc=(cy-y0+40)/d[3];                     // never puff above the room's top wall
    const hw=d[2]*sc/2;cx=Math.max(x0+hw-12,Math.min(x1-hw+12,cx)); // stay inside the side walls
    clouds.push({i,cx,cy,sc,delay,ph:Math.random()*6,flip:Math.random()<.5});};
  // a carpet of wide clouds along the floor
  for(let y=y0+h*0.55;y<=y1+10;y+=h*0.28) add(WIDE[Math.floor(Math.random()*WIDE.length)],x0+w/2,Math.min(y,y1+6),w,rnd(0,180));
  // rounded puffs filling the room
  const cols=Math.max(3,Math.round(w/140)),rows=Math.max(3,Math.round(h/100))+1;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const cx=x0+(c+0.5)*w/cols+rnd(-20,20),cy=y0+(r+1.1)*h/rows+rnd(-12,12);
    add(ROUND[Math.floor(Math.random()*ROUND.length)],cx,Math.min(cy,y1+6),(w/cols)*rnd(1.45,1.75),rnd(0,350)+r*60);
  }
  // a couple of tall billows at the edges
  add(TALL[Math.floor(Math.random()*TALL.length)],x0+w*0.1,y1-10,w*0.2,rnd(100,300));
  add(TALL[Math.floor(Math.random()*TALL.length)],x1-w*0.1,y1-10,w*0.2,rnd(100,300));
  const specks=Array.from({length:Math.round(w*h/9000)},()=>({x:rnd(x0,x1),y:rnd(y0,y1),r:rnd(3,8),vy:rnd(-.03,-.008),vx:rnd(-.02,.02),delay:rnd(200,2600)}));
  cleaning[id]={t:0,clouds,specks,swapped:false};
  const chip=document.getElementById('chip-'+id);chip.classList.add('busy');chip.querySelector('.st').textContent='そうじちゅう';
}
function stepDust(dt){
  for(const id in cleaning){
    const c=cleaning[id];c.t+=dt;
    if(!c.swapped&&c.t>POP+350){c.swapped=true;const img=document.querySelector(`.mess[data-room="${id}"]`);img.style.transition='none';setDirty(id,false);lastClean[id]=Date.now();save();tickMess(false);void img.offsetWidth;img.style.transition='';
      const chip=document.getElementById('chip-'+id);chip.querySelector('.st').textContent='そうじちゅう';}
    if(c.t>POP+HOLD+FADE+200){delete cleaning[id];document.getElementById('chip-'+id).classList.remove('busy');document.getElementById('chip-'+id).querySelector('.st').textContent='きれい';}
  }
}
function drawDust(){
  dc.clearRect(0,0,1536,1024);
  if(current!=='cottage'||!dustImg.complete||!dustImg.naturalWidth)return;
  dc.imageSmoothingEnabled=false;
  for(const id in cleaning){
    const c=cleaning[id],fade=c.t>POP+HOLD?Math.max(0,1-(c.t-POP-HOLD)/FADE):1;
    for(const k of c.clouds){
      const lt=c.t-k.delay;if(lt<=0)continue;
      let g=Math.min(1,lt/POP);g=Math.round((1-Math.pow(1-g,3))*6)/6;          // stepped pop-in
      const puff=1+Math.sin(c.t/420+k.ph)*0.035,sc=k.sc*(0.55+0.45*g)*puff*(1+(1-fade)*0.15);
      const d=DUST[k.i],w=d[2]*sc,h=d[3]*sc,dx=Math.sin(c.t/900+k.ph)*6,rise=(1-fade)*18;
      dc.globalAlpha=Math.min(1,g*1.4)*fade;
      dc.save();dc.translate(Math.round(k.cx+dx),Math.round(k.cy-rise));if(k.flip)dc.scale(-1,1);
      dc.drawImage(dustImg,d[0],d[1],d[2],d[3],Math.round(-w/2),Math.round(-h),Math.round(w),Math.round(h));dc.restore();
    }
    dc.fillStyle='#c79a72';
    for(const sp of c.specks){const lt=c.t-sp.delay;if(lt<=0)continue;dc.globalAlpha=Math.min(1,lt/300)*fade*0.9;
      const s=Math.round(sp.r);dc.fillRect(Math.round(sp.x+sp.vx*lt),Math.round(sp.y+sp.vy*lt),s,s);}
  }
  dc.globalAlpha=1;
}
/* ---------- rooms get messy on a timer, only while nobody is looking ---------- */
const MESS_EVERY={kitchen:15,living:30,bathroom:45,bedroom:60};   // minutes after the room was last cleaned
const SAVE_KEY='kotoba-garden-rooms';
let lastClean={};
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({lastClean,dirty:[...dirty]}));}catch(e){}}
function load(){
  let d=null;try{d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');}catch(e){}
  const now=Date.now();
  ROOMS.forEach(r=>{lastClean[r.id]=d&&d.lastClean&&Number.isFinite(d.lastClean[r.id])?d.lastClean[r.id]:now;});
  if(d&&Array.isArray(d.dirty))d.dirty.forEach(id=>{if(MESS_EVERY[id]){const img=document.querySelector(`.mess[data-room="${id}"]`);img.style.transition='none';setDirty(id,true);void img.offsetWidth;img.style.transition='';}});
}
function watching(){return current==='cottage'&&!document.hidden;}
function dueRooms(){const now=Date.now();return ROOMS.filter(r=>!dirty.has(r.id)&&!cleaning[r.id]&&now-lastClean[r.id]>=MESS_EVERY[r.id]*60000).map(r=>r.id);}
function tickMess(force){
  if(force||!watching()){
    const due=dueRooms();

/* ---------- market merge board: harvests arrive as level 1, two of the same merge into the next level ---------- */
const MCOLS=9,MROWS=6,MCELLS=MCOLS*MROWS,MB_KEY='kotoba-garden-market';
const MAXL=[5,5,5,5,5,5,5,5,1];               // eggplant (row 8) has no merge sprites yet
let mb=null;
try{mb=JSON.parse(localStorage.getItem(MB_KEY)||'null');}catch(e){mb=null;}
if(!mb||!Array.isArray(mb.cells)||mb.cells.length!==MCELLS)mb={cells:new Array(MCELLS).fill(null),store:[]};
function saveMB(){try{localStorage.setItem(MB_KEY,JSON.stringify(mb));}catch(e){}if(typeof renderOrders==='function')renderOrders();}
const mgrid=document.getElementById('mgrid');
const mcellEls=Array.from({length:MCELLS},(_,i)=>{const b=document.createElement('button');b.className='mcell';b.dataset.i=i;mgrid.appendChild(b);return b;});
function itemStyle(it){return MAXL[it.p]>1?{cls:'',pos:`${(it.l-1)/4*100}% ${it.p/8*100}%`}:{cls:' crop',pos:spritePos(it.p,6)};}
function renderCell(i,pop){
  const b=mcellEls[i],it=mb.cells[i];b.innerHTML='';
  if(!it){b.setAttribute('aria-label','あき');return;}
  const st=itemStyle(it),d=document.createElement('span');d.className='mitem'+st.cls+(pop?' pop':'');d.style.backgroundPosition=st.pos;b.appendChild(d);
  const lv=document.createElement('span');if(it.l===1){b.setAttribute('aria-label',`${PLANTS[it.p].jp} レベル1`);return;}lv.className='mlv'+(it.l>=MAXL[it.p]?' max':'');lv.textContent=it.l>=MAXL[it.p]&&MAXL[it.p]>1?'MAX':'Lv'+it.l;b.appendChild(lv);
  b.setAttribute('aria-label',`${PLANTS[it.p].jp} レベル${it.l}`);
}
function renderStore(){const n=mb.store.length;document.getElementById('mstore').hidden=!n;document.getElementById('mstoreN').textContent=n;}
function renderMB(){for(let i=0;i<MCELLS;i++)renderCell(i);renderStore();}
function refill(){let placed=[];for(let i=0;i<MCELLS&&mb.store.length;i++)if(!mb.cells[i]){mb.cells[i]=mb.store.shift();placed.push(i);}return placed;}
function addToMarket(p){mb.store.push({p,l:1});const placed=refill();saveMB();placed.forEach(i=>renderCell(i,true));renderStore();}
function act(a,b){
  if(a===b)return;const A=mb.cells[a],B=mb.cells[b];if(!A)return;
  if(!B){mb.cells[b]=A;mb.cells[a]=null;}
  else if(A.p===B.p&&A.l===B.l&&A.l<MAXL[A.p]){mb.cells[b]={p:A.p,l:A.l+1};mb.cells[a]=null;
    const placed=refill();saveMB();renderCell(a);renderCell(b,true);placed.forEach(i=>renderCell(i,true));renderStore();return;}
  else{mb.cells[b]=A;mb.cells[a]=B;}
  saveMB();renderCell(a);renderCell(b);
}
let msel=null,mdrag=null,ghost=null;
function setSel(i){if(msel!=null)mcellEls[msel].classList.remove('sel');mcellEls.forEach(c=>c.classList.remove('hint'));msel=i;
  if(i==null)return;mcellEls[i].classList.add('sel');const A=mb.cells[i];
  mb.cells.forEach((B,k)=>{if(k!==i&&B&&B.p===A.p&&B.l===A.l&&A.l<MAXL[A.p])mcellEls[k].classList.add('hint');});}
function cellAt(x,y){const r=mgrid.getBoundingClientRect();if(x<r.left||x>=r.right||y<r.top||y>=r.bottom)return null;
  return Math.floor((y-r.top)/r.height*MROWS)*MCOLS+Math.floor((x-r.left)/r.width*MCOLS);}
mgrid.addEventListener('pointerdown',e=>{
  const i=cellAt(e.clientX,e.clientY);if(i==null)return;e.preventDefault();
  mdrag={i,x:e.clientX,y:e.clientY,moved:false,has:!!mb.cells[i]};try{mgrid.setPointerCapture(e.pointerId);}catch(_){}
});
mgrid.addEventListener('pointermove',e=>{
  if(!mdrag||!mdrag.has)return;
  if(!mdrag.moved&&Math.hypot(e.clientX-mdrag.x,e.clientY-mdrag.y)>8){
    mdrag.moved=true;setSel(null);const it=mb.cells[mdrag.i],st=itemStyle(it),w=mcellEls[mdrag.i].getBoundingClientRect().width;
    ghost=document.createElement('div');ghost.className='mghost'+st.cls;ghost.style.cssText=`width:${w}px;height:${w*0.93}px;background-position:${st.pos}`;document.body.appendChild(ghost);
    mcellEls[mdrag.i].querySelector('.mitem')?.classList.add('lifting');}
  if(mdrag.moved){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';}
});
const endDrag=e=>{
  if(!mdrag)return;const d=mdrag;mdrag=null;
  if(ghost){ghost.remove();ghost=null;}
  if(d.moved){const t=cellAt(e.clientX,e.clientY);mcellEls[d.i].querySelector('.mitem')?.classList.remove('lifting');if(t!=null)act(d.i,t);return;}
  // a tap: select, then tap a target to move or merge

function lcsMarks(seq,ans){ // which of the player's tiles sit in the longest correct order
  const n=seq.length,m=ans.length,L=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=seq[i]===ans[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const mk=new Array(n).fill(false);let i=0,j=0;while(i<n&&j<m){if(seq[i]===ans[j]){mk[i]=true;i++;j++;}else if(L[i+1][j]>=L[i][j+1])i++;else j++;}
  return {len:L[0][0],mk};
}
function grade(g,seq){
  let best=null;
  for(const ans of [g.a,...(g.alt||[])]){const r=lcsMarks(seq,ans);const sc=Math.round(100*r.len/Math.max(ans.length,seq.length));if(!best||sc>best.sc)best={sc,ans,mk:r.mk};}
  const why=[];
  if(best.sc===100)why.push('Perfect! Every word is in the right place.');
  else{
    if(g.x&&seq.includes(g.x[0]))why.push(`「${g.x[0]}」 is the wrong form here. The sentence needs 「${g.x[1]}」.`);
    const trapped=g.x&&seq.includes(g.x[0]);
    const missing=best.ans.filter(t=>!seq.includes(t)&&!(trapped&&t===g.x[1]));
    if(missing.length)why.push(`You left out ${missing.map(t=>'「'+t+'」').join(' ')}.`);
    const wrongPlace=seq.filter((t,k)=>!best.mk[k]&&best.ans.includes(t));
    if(wrongPlace.length)why.push(`${wrongPlace.map(t=>'「'+t+'」').join(' ')} ${wrongPlace.length>1?'are':'is'} in the wrong place.`);
  }
  why.push(g.n);
  if(g.x&&seq.includes(g.x[0]))best.sc=Math.min(best.sc,50);   // the wrong grammar form fails the order
  return {score:best.sc,marks:best.mk,answer:best.ans.join('')+'。',why:why.join(' ')};
}

// sample a stroke into evenly spaced points (109x109 KanjiVG space)
const svgNS='http://www.w3.org/2000/svg',probe=document.createElementNS(svgNS,'svg');probe.setAttribute('width','0');probe.setAttribute('height','0');
probe.style.cssText='position:absolute;width:0;height:0;overflow:hidden';document.body.appendChild(probe);
const strokeCache={};
function strokesOf(k){
  if(strokeCache[k])return strokeCache[k];
  return strokeCache[k]=KBY[k].s.map(d=>{const p=document.createElementNS(svgNS,'path');p.setAttribute('d',d);probe.appendChild(p);
    const L=p.getTotalLength(),pts=[];for(let i=0;i<=24;i++){const q=p.getPointAtLength(L*i/24);pts.push([q.x,q.y]);}probe.removeChild(p);
    return {d,path:new Path2D(d),pts,len:L};});
}
function resample(poly,n){
  const segs=[];let tot=0;for(let i=1;i<poly.length;i++){const l=Math.hypot(poly[i][0]-poly[i-1][0],poly[i][1]-poly[i-1][1]);segs.push(l);tot+=l;}
  if(tot<1e-6)return Array.from({length:n+1},()=>poly[0].slice());
  const out=[poly[0].slice()];let acc=0,j=0;
  for(let i=1;i<=n;i++){const target=tot*i/n;while(j<segs.length-1&&acc+segs[j]<target){acc+=segs[j];j++;}
    const t=segs[j]?(target-acc)/segs[j]:0;out.push([poly[j][0]+(poly[j+1][0]-poly[j][0])*t,poly[j][1]+(poly[j+1][1]-poly[j][1])*t]);}
  return out;
}
function strokeMatches(user,st,loose){
  const u=resample(user,24),p=st.pts,dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let len=0;for(let i=1;i<user.length;i++)len+=dist(user[i],user[i-1]);
  if(len<4&&st.len>14)return false;                                  // a tap is not a stroke
  const mean=u.reduce((s,q,i)=>s+dist(q,p[i]),0)/u.length;
  const ends=loose?24:19,avg=loose?15:12.5;
  return dist(u[0],p[0])<ends&&dist(u[24],p[24])<ends+(st.len<18?6:0)&&mean<avg;
}

/* walls inside the cottage: cats never cut across these */
const WALLS={cottage:[[60,385,648,385],[752,385,1295,385],[855,80,855,385],[1293,385,1293,598],[1268,652,1268,850]],garden:[]};
// where a cat may stand (rectangles); a dropped cat lands at the closest point inside one of them
const FLOOR={cottage:[[95,232,845,372],[652,372,752,430],[110,420,1255,845],[1238,598,1300,655],[1282,605,1362,835]],garden:[[40,40,1500,990]]};

function nearestNode(c){const N=NAV[c.scene].nodes;let best=null,bd=1e9;for(const k in N){const d=Math.hypot(N[k][0]-c.x,N[k][1]-c.y);if(d<bd){bd=d;best=k;}}return best;}
function grab(c,e,x,y){held={cat:c,ox:c.x-x,oy:c.y-y,sx:e.clientX,sy:e.clientY,moved:false,drag:true};c.state='held';c.route=null;c.eating=null;c.t=0;stageEl.classList.add('holding');}
function drop(){const c=held.cat;held=null;[c.x,c.y]=landSpot(c.scene,c.x,c.y);stageEl.classList.remove('holding');c.state='landed';c.t=0;c.until=900;c.fromDoor=true;}
stageEl.addEventListener('pointerdown',e=>{
  const [x,y]=toLocal(e);
  if(held&&!held.drag){const c=held.cat;c.x=Math.max(50,Math.min(1486,x));c.y=Math.max(90,Math.min(1010,y+40));drop();suppressClick=true;e.preventDefault();return;}
  const c=catAt(x,y);
  if(c){grab(c,e,x,y);suppressClick=true;e.preventDefault();try{stageEl.setPointerCapture(e.pointerId);}catch(_){}}
});
stageEl.addEventListener('pointermove',e=>{
  const [x,y]=toLocal(e);
  if(held){const c=held.cat;if(Math.hypot(e.clientX-held.sx,e.clientY-held.sy)>6)held.moved=true;
    c.x=Math.max(50,Math.min(1486,x+held.ox));c.y=Math.max(90,Math.min(1010,y+held.oy));return;}
  stageEl.classList.toggle('overcat',!!catAt(x,y));
});
stageEl.addEventListener('pointerup',()=>{if(!held)return;if(held.moved)drop();else{held.drag=false;}});
stageEl.addEventListener('click',e=>{if(suppressClick){e.stopPropagation();e.preventDefault();suppressClick=false;}},true);
let lastT=performance.now();
function loop(now){const dt=Math.max(0,Math.min(60,now-lastT));lastT=now;cats.forEach(c=>stepCat(c,reduce?dt*0.6:dt));drawCats();stepDust(dt);drawDust();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>

</body></html>
